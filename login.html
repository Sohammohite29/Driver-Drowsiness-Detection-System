<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Driver Drowsiness Detection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #263b70 0%, transparent 35%),
                radial-gradient(circle at bottom right, #12345c 0%, transparent 35%),
                #08111f;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.25;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: -120px;
            right: -80px;
        }

        body::after {
            width: 250px;
            height: 250px;
            background: #2563eb;
            bottom: -100px;
            left: -80px;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 410px;
            max-width: 92%;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            padding: 38px 36px 30px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.30);
            font-size: 34px;
        }

        .title {
            text-align: center;
            color: #111827;
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: #6b7280;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            outline: none;
            padding: 0 45px 0 45px;
            font-size: 14px;
            color: #111827;
            background: #f9fafb;
            transition: 0.25s ease;
        }

        input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #6b7280;
            font-size: 17px;
            padding: 4px;
        }

        .password-toggle:hover {
            color: #2563eb;
        }

        .login-button {
            width: 100%;
            height: 51px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.32);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 9px;
            padding: 11px 13px;
            margin-bottom: 18px;
            font-size: 13px;
            text-align: center;
        }

        .account-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.8;
        }

        .account-links a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .account-links a:hover {
            text-decoration: underline;
        }

        .security-note {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            font-size: 12px;
            margin-top: 22px;
        }

        .security-icon {
            font-size: 13px;
        }

        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 23px 0 18px;
        }

        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 32px 25px 26px;
            }

            .title {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🚗
            </div>

            <h1 class="title">
                Driver Drowsiness
            </h1>

            <p class="subtitle">
                Detection & Monitoring System
            </p>

            {% if error %}
                <div class="error">
                    ⚠️ {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <!-- Username -->
                <div class="input-group">

                    <label class="input-label">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label class="input-label">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            id="toggleButton"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In →
                </button>

            </form>


            <!-- Account Links -->
            <div class="account-links">

                <div>
                    New user?
                    <a href="{{ url_for('create_account') }}">
                        Create Account
                    </a>
                </div>

                <div>
                    <a href="{{ url_for('reset_password') }}">
                        Forgot / Change Password?
                    </a>
                </div>

            </div>


            <div class="security-note">

                <span class="security-icon">
                    🔐
                </span>

                Secure Monitoring Access

            </div>


            <div class="divider"></div>


            <div class="footer">

                Driver Drowsiness Detection System<br>

            </div>

        </div>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.getElementById("toggleButton");


            if (password.type === "password") {

                password.type = "text";

                button.innerHTML = "🙈";

            } else {

                password.type = "password";

                button.innerHTML = "👁️";

            }

        }

    </script>

</body>
</html>
