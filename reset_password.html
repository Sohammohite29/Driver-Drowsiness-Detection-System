<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 90%;
            max-width: 400px;

            background: #111827;
            border: 1px solid #263244;

            border-radius: 10px;
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;

            background: #0f172a;
            border: 1px solid #374151;

            border-radius: 6px;

            color: white;
            outline: none;

            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 11px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #3f1515;
            color: #f87171;

            padding: 10px;
            border-radius: 6px;

            font-size: 11px;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            text-align: center;

            color: #8b949e;
            text-decoration: none;

            font-size: 11px;
            margin-top: 18px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Change Password</h1>

        <p>
            Enter your current password and create a new password.
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <label>
                Current Password
            </label>

            <input
                type="password"
                name="current_password"
                required
            >

            <label>
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                required
            >

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                required
            >

            <button type="submit">
                Change Password
            </button>

        </form>

        <a
            href="{{ url_for('login') }}"
            class="back">

            ← Back to Login

        </a>

    </div>

</body>

</html>
